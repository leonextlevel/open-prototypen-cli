<!doctype html>
<html lang="__LANG__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Prototypen</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #202124;
        color: white;
        font: 16px system-ui;
        --reserved: 0px;
      }
      body.has-scenarios {
        --reserved: calc(14rem + 24px);
      }
      .scenarios {
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        width: 14rem;
        padding: 16px;
        border-radius: 8px;
        background: #303134;
        font-size: 14px;
      }
      .scenarios h2 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .scenarios label {
        display: block;
        margin-bottom: 12px;
      }
      .scenarios select,
      .scenarios button {
        display: block;
        width: 100%;
        margin-top: 4px;
        font: inherit;
      }
      .scenarios :focus-visible {
        outline: 3px solid #8ab4f8;
      }
      @media (max-width: 640px) {
        body.has-scenarios {
          --reserved: 0px;
        }
      }
      .stage {
        position: relative;
      }
      .stage img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .hotspot {
        position: absolute;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .hotspot:focus-visible {
        outline: 3px solid #1769ff;
        background: #1769ff44;
      }
      .overlay-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0009;
      }
      .overlay-backdrop .stage:focus {
        outline: none;
      }
      .overlay-backdrop .stage {
        box-shadow: 0 12px 60px #0008;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: pre-wrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script id="prototype-data" type="application/json">
      __DATA__
    </script>
    <script type="module">
      const data = JSON.parse(
        document.getElementById('prototype-data').textContent,
      );
      const app = document.getElementById('app');
      const history = [];
      const scenarios = data.scenarios || [];
      const state = {};
      let current = data.initialScreen;
      let overlay = null;
      let placement = 'center';
      // The hotspot slot on the screen below that opened the current overlay.
      let opener = null;

      function stage(name) {
        const config = data.screens[name];
        const root = document.createElement('div');
        root.className = 'stage';
        root.style.width =
          'min(calc(100vw - var(--reserved)), calc(100vh * ' +
          config.width / config.height +
          '), ' +
          config.width +
          'px)';
        root.style.aspectRatio = config.width + '/' + config.height;

        const image = document.createElement('img');
        image.src = 'screens/' + name + '.png';
        image.alt = '';
        root.append(image);

        const accessible = document.createElement('section');
        accessible.className = 'sr-only';
        accessible.setAttribute('aria-label', config.title);
        const heading = document.createElement('h1');
        heading.textContent = config.title;
        heading.tabIndex = -1;
        const content = document.createElement('p');
        content.textContent = config.content;
        accessible.append(heading, content);
        root.append(accessible);

        // Only the last active action on each node gets a hotspot, so pointer,
        // keyboard, and assistive technology all reach the same action.
        const effective = new Map();
        for (const action of Object.values(config.actions))
          if (!action.when || state[action.when.key] === action.when.value)
            effective.set(action.slot, action);
        for (const action of effective.values()) {
          const button = document.createElement('button');
          button.className = 'hotspot';
          button.type = 'button';
          button.setAttribute('aria-label', action.label);
          button.dataset.slot = action.slot;
          button.style.left = (action.bounds.x / config.width) * 100 + '%';
          button.style.top = (action.bounds.y / config.height) * 100 + '%';
          button.style.width = (action.bounds.width / config.width) * 100 + '%';
          button.style.height =
            (action.bounds.height / config.height) * 100 + '%';
          button.addEventListener('click', () => act(action));
          root.append(button);
        }
        return root;
      }

      // Every action rebuilds the DOM, so each one says where focus goes next:
      // the new screen's title, or the hotspot in a slot, which a set-state keeps
      // and closing an overlay returns to.
      function act(action) {
        let focus = 'screen';
        switch (action.action) {
          case 'navigate':
            history.push(current);
            current = action.target;
            overlay = null;
            break;
          case 'back':
            current = history.pop() || data.initialScreen;
            overlay = null;
            break;
          case 'open-overlay':
            if (!overlay) opener = action.slot;
            overlay = action.target;
            placement = action.placement || 'center';
            break;
          case 'close-overlay':
            closeOverlay();
            return;
          case 'set-state':
            state[action.key] = action.value;
            if (action.target) {
              history.push(current);
              current = action.target;
              overlay = null;
            } else focus = { slot: action.slot };
            break;
          case 'external-link':
            window.open(action.url, '_blank', 'noopener,noreferrer');
            return;
        }
        draw(focus);
      }

      // The scenario panel lies outside the screens, so overlays never make it inert
      // and redraws keep focus on it.
      function scenarioPanel() {
        const panel = document.createElement('aside');
        panel.className = 'scenarios';
        panel.setAttribute('aria-labelledby', 'scenarios-title');
        const heading = document.createElement('h2');
        heading.id = 'scenarios-title';
        heading.lang = 'en';
        heading.textContent = 'Scenarios';
        panel.append(heading);
        for (const scenario of scenarios) {
          const label = document.createElement('label');
          label.textContent = scenario.label;
          const select = document.createElement('select');
          select.dataset.scenario = scenario.key;
          for (const option of scenario.values)
            select.append(new Option(option.label, option.value));
          select.addEventListener('change', () => {
            state[scenario.key] = select.value;
            draw('none');
          });
          label.append(select);
          panel.append(label);
        }
        const reset = document.createElement('button');
        reset.type = 'button';
        reset.lang = 'en';
        reset.textContent = 'Reset';
        reset.addEventListener('click', () => {
          restart();
          draw('screen');
        });
        panel.append(reset);
        return panel;
      }

      // Restores initial scenario values, clears history, and returns to the initial screen.
      function restart() {
        for (const key of Object.keys(state)) delete state[key];
        for (const scenario of scenarios)
          state[scenario.key] = scenario.initial;
        history.length = 0;
        current = data.initialScreen;
        overlay = null;
        for (const select of document.querySelectorAll('[data-scenario]'))
          select.value = state[select.dataset.scenario];
      }

      function closeOverlay() {
        overlay = null;
        draw({ slot: opener });
      }

      function focusSlot(layer, slot) {
        const target =
          slot && layer.querySelector('[data-slot="' + CSS.escape(slot) + '"]');
        (target || layer.querySelector('h1')).focus();
      }

      // `focus` is 'none' when a scenario control changed, so focus stays in the panel.
      function draw(focus) {
        const base = stage(current);
        app.replaceChildren(base);
        document.body.dataset.screen = current;
        document.body.dataset.overlay = overlay || '';
        if (!overlay) {
          if (focus && focus !== 'none') focusSlot(base, focus.slot);
          return;
        }
        // The overlay is modal: the screen below leaves the tab order and accessibility tree.
        base.inert = true;
        const backdrop = document.createElement('div');
        backdrop.className = 'overlay-backdrop';
        backdrop.addEventListener('click', (event) => {
          if (event.target === backdrop) closeOverlay();
        });
        const dialog = stage(overlay);
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');
        dialog.setAttribute('aria-label', data.screens[overlay].title);
        dialog.tabIndex = -1;
        backdrop.append(dialog);
        app.append(backdrop);
        if (placement === 'bottom') {
          // Anchor to the bottom edge of the screen below, at that screen's scale.
          const box = base.getBoundingClientRect();
          const scale = box.width / data.screens[current].width;
          const width = data.screens[overlay].width * scale;
          dialog.style.position = 'fixed';
          dialog.style.width = width + 'px';
          dialog.style.left = box.left + (box.width - width) / 2 + 'px';
          dialog.style.top =
            box.bottom - data.screens[overlay].height * scale + 'px';
        }
        if (focus === 'none') return;
        if (focus && focus.slot) focusSlot(dialog, focus.slot);
        else dialog.focus();
      }
      window.addEventListener('resize', () => {
        if (overlay && placement === 'bottom')
          draw(
            document.activeElement.closest('.scenarios')
              ? 'none'
              : { slot: document.activeElement.dataset.slot },
          );
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && overlay) closeOverlay();
      });
      if (scenarios.length) {
        document.body.classList.add('has-scenarios');
        document.body.prepend(scenarioPanel());
      }
      restart();
      draw();
    </script>
  </body>
</html>
