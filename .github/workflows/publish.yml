name: Verify and stage npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.20.0
      - name: Check release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: npm pack --dry-run
      - name: Verify manually published first version
        if: github.event.release.tag_name == 'v0.1.0'
        run: test "$(npm view open-prototypen-cli@0.1.0 version)" = '0.1.0'
      - name: Stage next version for maintainer approval
        if: github.event.release.tag_name != 'v0.1.0'
        run: npm stage publish . --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
